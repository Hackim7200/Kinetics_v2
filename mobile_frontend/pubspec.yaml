name: mobile_frontend
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.0.0
  path_provider: ^2.1.0
  path: ^1.9.0

  #Data storage
  sqlite3_flutter_libs: ^0.5.0
  drift: ^2.31.0
  sqlite3: ^2.4.0
  shared_preferences: ^2.3.3

  #State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  #Utility
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  fl_chart: ^1.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.31.0
  flutter_launcher_icons: ^0.14.3

  # State management (codegen + lints)
  riverpod_lint: ^3.1.3
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beep.wav
    - assets/sounds/beep_long.wav



# App launcher icons (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/arm_and_bolt.png
  # Android adaptive icon: background behind the foreground asset
  adaptive_icon_background: "#F9F9F9"
  adaptive_icon_foreground: assets/arm_and_bolt.png
  # Required for App Store (no alpha on app icon)
  remove_alpha_ios: true
